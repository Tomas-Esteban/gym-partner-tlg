services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gym-assistant-bot
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/gym_assistant.db
      ROUTINES_PATH: data/routines
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
